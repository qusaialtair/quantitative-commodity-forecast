# ─────────────────────────────────────────────────────────────────────────────
#  nginx.conf — Altair MK1 Reverse Proxy
#  Lightweight single-worker config for Oracle Linux 9 AMD Micro
#  Memory footprint: ~12–20 MB RSS
# ─────────────────────────────────────────────────────────────────────────────

# One worker process saturates the single vCPU without context-switch overhead
worker_processes 1;

error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    # 512 concurrent connections per worker — ample for a personal trading
    # terminal; avoids the accept_mutex overhead of higher values.
    worker_connections 512;
    use epoll;
    multi_accept on;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Logging ──────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_method $request_uri $status '
                    '$body_bytes_sent "$http_referer"';
    access_log /var/log/nginx/access.log main;

    # ── Performance ───────────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    gzip               on;
    gzip_types         text/plain text/css application/json
                       application/javascript text/xml application/xml
                       application/xml+rss text/javascript;

    # ── Upstream definitions ──────────────────────────────────────────────────
    upstream frontend_app {
        server frontend:3000;
        keepalive 8;
    }

    upstream backend_api {
        server backend:8000;
        keepalive 4;
    }

    # ── Main server block ─────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;           # matches any hostname / bare IP

        # Security headers
        add_header X-Frame-Options           "SAMEORIGIN"  always;
        add_header X-Content-Type-Options    "nosniff"     always;
        add_header X-XSS-Protection          "1; mode=block" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

        # ── FastAPI backend routes ────────────────────────────────────────────
        # /api/*          REST endpoints (snapshot, health, phase14, etc.)
        # /ws             WebSocket live-update channel
        # /qctf-backend/* Next.js rewrite proxy pass-through
        location /api/ {
            proxy_pass         http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        location /ws {
            proxy_pass             http://backend_api;
            proxy_http_version     1.1;
            # WebSocket upgrade headers
            proxy_set_header       Upgrade    $http_upgrade;
            proxy_set_header       Connection "upgrade";
            proxy_set_header       Host       $host;
            proxy_read_timeout     3600s;     # hold WS connections for up to 1h
            proxy_send_timeout     3600s;
        }

        location /qctf-backend/ {
            proxy_pass         http://backend_api/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # ── Next.js frontend (all other traffic) ─────────────────────────────
        location / {
            proxy_pass         http://frontend_app;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;

            # Next.js serves its own cache headers — don't interfere
            proxy_cache_bypass $http_upgrade;
        }

        # ── Health check endpoint (used by load balancer or uptime monitors) ─
        location /nginx-health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}
